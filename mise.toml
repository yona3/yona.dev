[tasks.install]
description = "Install dependencies"
run = "pnpm install"
dir = "{{config_root}}/web"

[tasks.dev]
description = "Start development server"
run = "pnpm dev"
dir = "{{config_root}}/web"

[tasks.build]
description = "Production build"
run = "pnpm build"
dir = "{{config_root}}/web"

[tasks.start]
description = "Start production server"
run = "pnpm start"
dir = "{{config_root}}/web"

[tasks.lint]
description = "Run ESLint"
run = "pnpm lint"
dir = "{{config_root}}/web"

[tasks.format]
description = "Format code with Prettier and fix lint"
run = "pnpm format"
dir = "{{config_root}}/web"

[tasks.verify]
description = "Run all verification checks"
depends = ["lint", "build"]
